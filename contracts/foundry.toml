[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
via_ir = true
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
fs_permissions = [
  { access = "read", path = "../app/src/engine/data" },
  { access = "read-write", path = "../app/src/config" },
  { access = "read", path = "./out" },
]

[fuzz]
runs = 512

[invariant]
runs = 64
depth = 40
fail_on_revert = false

[rpc_endpoints]
monad_testnet = "${MONAD_RPC_URL}"

[lint]
exclude_lints = ["unsafe-typecast", "mixed-case-variable", "screaming-snake-case-const", "asm-keccak256"]
lint_on_build = false
